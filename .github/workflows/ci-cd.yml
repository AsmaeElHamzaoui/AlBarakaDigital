name: CI/CD Pipeline - Al Baraka Digital

# Déclenchement de la pipeline sur push et PR vers main
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    name: Build, Dockerize & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build du projet avec Maven (skip tests)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Login Docker (optionnel si tu pushes sur DockerHub)
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build l'image Docker
      - name: Build Docker image
        run: |
          docker build -t albaraka-digital:latest .

      # 6️⃣ Tag et push l'image sur DockerHub
      - name: Push Docker image
        run: |
          docker tag albaraka-digital:latest ${{ secrets.DOCKER_USERNAME }}/albaraka-digital:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/albaraka-digital:latest

      # 7️⃣ Déploiement avec docker-compose
      - name: Deploy with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d --build
