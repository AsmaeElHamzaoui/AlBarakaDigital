<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #2f3640;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }

        .btn-primary {
            background: #273c75;
            color: white;
        }

        .btn-success {
            background: #44bd32;
            color: white;
        }

        .btn-danger {
            background: #e84118;
            color: white;
        }

        .btn-secondary {
            background: #7f8fa6;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info {
            flex: 1;
        }

        .actions button {
            margin-left: 6px;
        }

        .approved {
            color: green;
            font-weight: bold;
        }

        .rejected {
            color: red;
            font-weight: bold;
        }

        .logout {
            float: right;
        }
    </style>
</head>
<body>

<h2>
    Dashboard Agent
    <button class="btn-secondary logout" onclick="logout()">Déconnexion</button>
</h2>

<button class="btn-primary" onclick="loadPending()">🔄 Charger les opérations en attente</button>

<ul id="pending"></ul>

<script>
    // ================================
    // Auth JWT
    // ================================
    const jwtToken = localStorage.getItem("token");

    if (!jwtToken) {
        window.location.href = "/login.html";
    }

    function logout() {
        localStorage.removeItem("token");
        window.location.href = "/login.html";
    }

    // ================================
    // Charger opérations pending (JWT)
    // ================================
    async function loadPending() {
        try {
            const res = await fetch("/api/agent/operations/pending", {
                headers: {
                    "Authorization": "Bearer " + jwtToken
                }
            });

            if (!res.ok) {
                if (res.status === 401 || res.status === 403) {
                    logout();
                }
                throw new Error("Erreur lors du chargement des opérations");
            }

            const data = await res.json();
            const list = document.getElementById("pending");

            if (data.length === 0) {
                list.innerHTML = "<li>Aucune opération en attente</li>";
                return;
            }

            list.innerHTML = data.map(op => `
                <li id="op-${op.id}">
                    <div class="info">
                        <strong>Client :</strong> ${op.clientName}<br>
                        <strong>Type :</strong> ${op.type}<br>
                        <strong>Montant :</strong> ${op.amount} DH
                        <div id="status-${op.id}"></div>
                    </div>
                    <div class="actions">
                        <button class="btn-success" onclick="approve(${op.id})">✔</button>
                        <button class="btn-danger" onclick="reject(${op.id})">✖</button>
                        <button class="btn-secondary" onclick="downloadDocument(${op.id})">📄</button>
                    </div>
                </li>
            `).join("");

        } catch (err) {
            alert(err.message);
        }
    }

    // ================================
    // Approve (JWT)
    // ================================
    async function approve(id) {
        try {
            const res = await fetch(`/api/agent/operations/${id}/approve`, {
                method: "PUT",
                headers: {
                    "Authorization": "Bearer " + jwtToken
                }
            });

            if (!res.ok) throw new Error("Impossible d'approuver");

            const status = document.getElementById(`status-${id}`);
            status.textContent = "✔ Approuvée";
            status.className = "approved";

        } catch (err) {
            alert(err.message);
        }
    }

    // ================================
    // Reject (JWT)
    // ================================
    async function reject(id) {
        try {
            const res = await fetch(`/api/agent/operations/${id}/reject`, {
                method: "PUT",
                headers: {
                    "Authorization": "Bearer " + jwtToken
                }
            });

            if (!res.ok) throw new Error("Impossible de rejeter");

            const status = document.getElementById(`status-${id}`);
            status.textContent = "✖ Rejetée";
            status.className = "rejected";

        } catch (err) {
            alert(err.message);
        }
    }

    // ================================
    // Télécharger document (JWT)
    // ================================
    async function downloadDocument(id) {
        try {
            const res = await fetch(`/api/agent/operations/${id}/document`, {
                headers: {
                    "Authorization": "Bearer " + jwtToken
                }
            });

            if (!res.ok) throw new Error("Document introuvable");

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = `document_operation_${id}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();

            window.URL.revokeObjectURL(url);

        } catch (err) {
            alert(err.message);
        }
    }
</script>

</body>
</html>
