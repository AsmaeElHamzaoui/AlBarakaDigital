# Test Profile Configuration
spring.application.name=AlBarakaDigital-Test

# ===============================
# TEST DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/albarakadigital_test_db
spring.datasource.username=postgres
spring.datasource.password=test1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LIQUIBASE (Disable for tests)
# ===============================
spring.liquibase.enabled=false

# ===============================
# JWT CUSTOM
# ===============================
jwt.secret=testSecretKeyForJwtTokenGenerationInTestEnvironmentOnly123456789
jwt.expiration=3600000

# ===============================
# OAUTH2 / KEYCLOAK (Test)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/SpringSecurityKeycloakRealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/SpringSecurityKeycloakRealm/protocol/openid-connect/certs

spring.security.oauth2.client.registration.keycloak.client-id=my-app-client
spring.security.oauth2.client.registration.keycloak.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=password
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/SpringSecurityKeycloakRealm

# ===============================
# LOGGING
# ===============================
logging.level.com.AlBarakaDigital=DEBUG
logging.level.org.springframework.security=DEBUG